<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amirshayan Hamidin, full stack engineer</title>
<meta name="description" content="Portfolio of Amirshayan Hamidin, software engineer graduating from San Francisco State University in December 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6EAEE; --dot:#C3CBD4; --card:#F8F9FA; --ink:#22272E; --muted:#5F6874;
  --pencil:#5677C9; --firuzeh:#12807C; --line:#B5BFCA; --shadow:0 1px 0 rgba(34,39,46,.06),0 8px 24px rgba(34,39,46,.08);
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C2229; --dot:#323B46; --card:#262E37; --ink:#E7EAEE; --muted:#9BA5B0;
    --pencil:#86A2E6; --firuzeh:#41BDB6; --line:#3D4754; --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#1C2229; --dot:#323B46; --card:#262E37; --ink:#E7EAEE; --muted:#9BA5B0;
  --pencil:#86A2E6; --firuzeh:#41BDB6; --line:#3D4754; --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--firuzeh);outline-offset:3px;border-radius:4px}
.wash{background:color-mix(in srgb,var(--firuzeh) 12%,transparent)}

/* canvas */
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);
  background-size:24px 24px}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;left:-3000px;top:-3000px;width:6000px;height:6000px;overflow:visible;pointer-events:none}
#wires path{fill:none;stroke:var(--pencil);stroke-width:1.4;stroke-dasharray:5 6;opacity:.55}

.cluster{position:absolute;font-weight:650;font-stretch:112%;font-size:22px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;transition:opacity .25s}
.cluster .n{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;font-size:14px;line-height:22px;font-weight:600;font-stretch:100%;vertical-align:3px;color:var(--ink);background:color-mix(in srgb,var(--firuzeh) 14%,transparent);font-variant-numeric:tabular-nums}
.cluster small{display:block;font-weight:400;font-stretch:100%;font-size:14px;color:var(--muted);letter-spacing:0}
.cluster.dim{opacity:.3}

.note{position:absolute;width:max-content;max-width:290px;font-family:var(--hand);font-size:23px;line-height:1.1;color:var(--pencil);pointer-events:none;transform:rotate(-2deg);transition:opacity .25s}
.note svg{display:block;margin-top:2px;overflow:visible}
.note path{fill:none;stroke:var(--pencil);stroke-width:1.6;stroke-linecap:round}
.note.dim{opacity:.25}

/* cards: a sketch layer over a render layer */
.card{position:absolute;width:300px;padding:0;border:0;background:none;text-align:left;cursor:pointer;border-radius:3px;transition:opacity .25s}
.card .rd{position:relative;display:block;min-height:168px;background:var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);padding:18px 20px 16px;
  opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease,border-color .2s,box-shadow .2s}
.card .rd::before{content:"";position:absolute;left:20px;top:0;width:44px;height:3px;background:var(--firuzeh)}
.card .sk{position:absolute;inset:0;border:1.6px dashed var(--pencil);border-radius:3px;padding:16px 20px;opacity:1;transition:opacity .35s ease}
.card .sk span{font-family:var(--hand);font-size:27px;line-height:1.05;color:var(--pencil)}
.card .sk i{display:block;margin-top:12px;height:1.5px;background:var(--pencil);opacity:.45;border-radius:2px}
.card .sk i:nth-of-type(2){width:72%}
.card .sk i:nth-of-type(3){width:48%}
.card.rendered .rd{opacity:1;transform:none}
.card.rendered .sk{opacity:0}
.card:hover .rd,.card[aria-expanded="true"] .rd{border-color:var(--firuzeh)}
.card.dim{opacity:.22}
.card.hl .rd{border-color:var(--firuzeh);box-shadow:0 0 0 2px color-mix(in srgb,var(--firuzeh) 35%,transparent),var(--shadow)}
.card h3{margin:2px 0 4px;font-size:18px;line-height:1.2;font-weight:650;font-stretch:104%;letter-spacing:-.005em}
.card .stack{font-size:13px;color:var(--muted);margin:0 0 10px}
.card .gist{font-size:14.5px;margin:0}
.card .when{position:absolute;right:20px;top:16px;font-size:12.5px;color:var(--muted)}
.card.wide{width:640px}
.card.wide .rd{display:grid;min-height:0;grid-template-columns:1fr 1fr;gap:6px 28px;align-content:start}
.card.wide h3{grid-column:1/-1}
.kit{font-size:14px;margin:0}
.kit b{display:block;font-weight:600;font-size:13px;color:var(--muted)}

/* title block, in the manner of a drawing sheet */
.title-block{position:absolute;width:420px;background:var(--card);border:1.5px solid var(--ink);border-radius:2px;box-shadow:var(--shadow);display:grid;grid-template-columns:118px 1fr;cursor:default}
.tb-star{grid-row:1/4;display:grid;place-items:center;border-right:1px solid var(--ink)}
.tb-star svg{width:78px;height:78px}
.tb-star polygon{fill:none;stroke:var(--firuzeh);stroke-width:1.6;stroke-linejoin:round}
.tb-star circle{fill:var(--firuzeh)}
.tb-name{padding:14px 18px 10px;border-bottom:1px solid var(--ink)}
.tb-name h1{margin:0;font-size:30px;line-height:.98;font-weight:780;font-stretch:118%;letter-spacing:-.02em}
.tb-name p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.tb-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ink)}
.tb-row:last-child{border-bottom:0}
.tb-cell{padding:7px 12px 8px 18px;font-size:13.5px;line-height:1.3}
.tb-cell + .tb-cell{border-left:1px solid var(--ink);padding-left:12px}
.tb-cell b{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}

/* fixed chrome */
.chrome{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px}
#top{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left));top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:calc(100% - 32px)}
#plate{padding:10px 14px;font-size:13.5px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#plate strong{font-weight:650;font-stretch:110%}
#plate a{color:var(--muted);text-decoration:none}
#plate a:hover{color:var(--firuzeh);text-decoration:underline}
.chips{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
#filters{padding:3px}
.chip{border:0;background:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:13px;white-space:nowrap;line-height:1.2}
.chip:hover{background:color-mix(in srgb,var(--firuzeh) 8%,transparent)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--firuzeh) 16%,transparent);font-weight:600}
.chip .c{color:var(--muted);font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums}
.chip.skill{border:1px solid var(--firuzeh);font-weight:600;margin-left:4px}
.chip.skill[hidden]{display:none}
#tools{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;padding:4px;transition:left .3s ease}
#tools button{border:0;background:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:14px;white-space:nowrap}
#tools button:hover{background:color-mix(in srgb,var(--firuzeh) 12%,transparent)}
#tools .zoomgrp{display:contents}
#tools #ovbtn{font-weight:600;color:var(--firuzeh)}
#tools .sep{width:1px;align-self:stretch;margin:6px 2px;background:var(--line)}
#zoomval{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
#hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));font-family:var(--hand);font-size:22px;color:var(--pencil);white-space:nowrap;transition:opacity .6s,left .3s ease;pointer-events:none}

/* tooltip */
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px;padding:7px 10px;font-size:12.5px;line-height:1.35;max-width:270px;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip b{display:block;font-size:13.5px;font-weight:650;margin-bottom:1px}
#tip span{display:block;color:var(--muted)}

/* detail panel */
#panel{position:fixed;z-index:9;top:calc(16px + env(safe-area-inset-top,0px));right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100% - 32px));
  background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:26px 28px 0;overflow:auto;overscroll-behavior:contain;
  transform:translateX(calc(100% + 40px));transition:transform .32s ease;visibility:hidden}
#panel.open{transform:none;visibility:visible}
#panel h2{margin:0 36px 4px 0;font-size:24px;line-height:1.15;font-weight:700;font-stretch:110%;letter-spacing:-.015em}
#panel .stack{color:var(--muted);font-size:14px;margin:0 0 4px}
#panel .when{color:var(--muted);font-size:13.5px;margin:0 0 14px}
#panel .when:empty{margin:0 0 10px}
.lede{font-size:15.5px;line-height:1.55;margin:0 0 16px;max-width:62ch}
#panel ul{padding-left:18px;margin:0 0 6px}
#panel li{margin-bottom:9px;max-width:62ch}
#panel li::marker,#doc li::marker{color:var(--firuzeh)}
#panel .sec p{margin:0 0 10px;max-width:62ch}
#panel h3{position:relative;margin:22px 0 8px;padding-top:10px;font-size:15px;line-height:1.25;font-weight:650;font-stretch:106%;letter-spacing:-.005em}
#panel h3::before{content:"";position:absolute;left:0;top:0;width:28px;height:2px;background:var(--firuzeh)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;padding:1px 4px;border-radius:3px;background:color-mix(in srgb,var(--firuzeh) 11%,transparent);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;margin:0 0 16px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stats div{background:var(--card);padding:10px 12px 9px}
.stats b{display:block;font-size:19px;line-height:1.1;font-weight:700;font-stretch:108%;color:var(--ink)}
.stats sup{font-size:.62em;line-height:0;vertical-align:.5em}
.stats span{display:block;margin-top:3px;font-size:12.5px;line-height:1.3;color:var(--muted)}
.stats div::before{content:"";display:block;width:16px;height:2px;margin-bottom:7px;background:var(--firuzeh)}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0 0 6px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.facts dt{color:var(--muted);font-size:12.5px;font-weight:500;padding-top:1px}
.facts dd{margin:0}
#panel .aside{font-family:var(--hand);font-size:23px;line-height:1.15;color:var(--pencil);margin:18px 0 0}
#panel .aside:empty{display:none}
#close{position:absolute;top:14px;right:14px;width:36px;height:36px;border:0;border-radius:4px;background:none;cursor:pointer;font-size:22px;line-height:1}
#close:hover{background:color-mix(in srgb,var(--firuzeh) 12%,transparent)}
#p-foot{position:sticky;bottom:0;z-index:1;margin:22px -28px 0;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:none;border-radius:4px;padding:7px 12px;cursor:pointer;font-size:13.5px;text-decoration:none;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--firuzeh);color:var(--firuzeh)}
#p-foot .grow{flex:1}
#p-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.badge{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--firuzeh) 14%,transparent);border:1px solid color-mix(in srgb,var(--firuzeh) 45%,transparent)}
.finds{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:4px 0 12px}
.find{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start;background:var(--card);padding:14px 16px}
.find > b{font-size:21px;line-height:1.15;font-weight:750;font-stretch:110%;color:var(--firuzeh)}
#panel .find p,#doc .find p,.find p{margin:0;max-width:62ch}
.find .ft{font-size:14.5px;font-weight:650}
.find .fd{font-size:13.5px;margin-top:3px;line-height:1.45}
#panel .fintro,.fintro{font-size:14px;color:var(--muted);margin:0 0 10px}
.fails{display:grid;gap:10px;margin:0 0 12px}
.fail{border:1px solid var(--line);border-radius:6px;padding:12px 14px 10px;background:var(--card)}
.fhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.fail .tag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;padding:2px 7px;border-radius:3px;border:1px solid var(--line)}
.fail .x{font-size:12.5px;font-weight:650;color:var(--pencil)}
.fail .got{margin-left:auto;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
#panel .fail p,#doc .fail p,.fail p{margin:0 0 6px;max-width:62ch}
.fail .hyp{font-size:14.5px;font-weight:600;line-height:1.4}
.fail dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:13.5px;line-height:1.45}
.fail dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.fail dd{margin:0}
@media (max-width:640px){.find{grid-template-columns:1fr;gap:4px}.fail dl{grid-template-columns:1fr;gap:1px}.fail dd{margin-bottom:5px}}
/* figures */
.fig{margin:4px 0 14px}
.fig .fs{display:block;width:100%;height:auto;overflow:visible}
.fig figcaption{font-size:12.5px;line-height:1.4;color:var(--muted);margin-top:6px;max-width:62ch}
.fs text{font-family:var(--sans);font-size:12.5px;fill:var(--ink)}
.fs .b{font-weight:600}
.fs .m{fill:var(--muted)}
.fs .s{font-size:11.5px}
.fs .big{font-size:26px;font-weight:700;font-stretch:108%}
.fs .bx{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.fs .bx.em{stroke:var(--firuzeh);stroke-width:1.6;fill:color-mix(in srgb,var(--firuzeh) 7%,var(--card))}
.fs .zone{fill:none;stroke:var(--line);stroke-width:1.2}
.fs .ln{fill:none;stroke:var(--muted);stroke-width:1.3}
.fs .ln.em{stroke:var(--firuzeh);stroke-width:1.6}
.fs .ln.w2{stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fs .ax{stroke:var(--line);stroke-width:1;fill:none}
.fs .ln.ann{stroke:var(--pencil)}
.fs text.ann{fill:var(--pencil)}
.fs .flr{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.fs .ah{fill:var(--muted)}
.fs .ah.em{fill:var(--firuzeh)}
.fs .dot{fill:var(--firuzeh);stroke:var(--card);stroke-width:2}
.fs .ring{fill:var(--card);stroke:var(--muted);stroke-width:2}
.fs .cell{fill:var(--firuzeh)}
.fs .cell.no{fill:none;stroke:var(--muted);stroke-width:1.2}
.fs .node{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.fs .node.em{stroke:var(--firuzeh);stroke-width:1.8;fill:color-mix(in srgb,var(--firuzeh) 9%,var(--card))}
.fs .hit{fill:transparent}
.fs .cross{stroke:var(--ink);stroke-width:1;opacity:0}
.fs .cross.on,.fs .crossdot.on{opacity:1}
.fs .crossdot{fill:var(--ink);stroke:var(--card);stroke-width:2;opacity:0}
.fs .done{fill:var(--firuzeh)}
.fs .half{fill:color-mix(in srgb,var(--firuzeh) 45%,var(--card));stroke:var(--firuzeh);stroke-width:1.6}
.fs .chk{fill:none;stroke:var(--card);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* skills matrix */
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mx{border-collapse:collapse;font-size:13px;line-height:1.2;margin:0 0 4px}
.mx th,.mx td{padding:0;height:24px;font-weight:400}
.mx thead th{vertical-align:bottom;padding-bottom:6px}
.mx thead th.col{width:40px;height:96px}
.mx thead th.col button{writing-mode:vertical-rl;transform:rotate(180deg);border:0;background:none;padding:4px 2px;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;border-radius:3px}
.mx thead th.col button:hover{color:var(--firuzeh)}
.mx thead th.cnt{text-align:left;font-size:12px;color:var(--muted);padding-left:10px}
.mx .grp th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 0 4px}
.mx tr.sk{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.mx tr.sk th{text-align:left;padding-right:12px;white-space:nowrap}
.mx tr.sk th button{border:0;background:none;padding:3px 6px 3px 0;cursor:pointer;font-size:13px;text-align:left}
.mx tr.sk th button:hover{color:var(--firuzeh)}
.mx td.c{width:40px;text-align:center}
.mx .d{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--firuzeh);box-shadow:0 0 0 2px var(--card)}
.mx td.n{padding-left:10px;white-space:nowrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mx .nb{display:inline-block;height:6px;border-radius:0 3px 3px 0;background:var(--firuzeh);opacity:.55;vertical-align:middle;margin-right:6px}
.mx tr.sk:hover td,.mx tr.sk:hover th,.mx .colhl{background:color-mix(in srgb,var(--firuzeh) 8%,transparent)}
.mx tr.sk.on td,.mx tr.sk.on th{background:color-mix(in srgb,var(--firuzeh) 15%,transparent)}
.mx tr.sk.on th button{font-weight:650}
.mx .off{opacity:.3}
.also{font-size:13px;color:var(--muted);margin:8px 0 0}
.also b{color:var(--ink);font-weight:600}

/* overview and plain reading views */
.view{position:fixed;inset:0;z-index:8;background:var(--paper);overflow:auto;display:none;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(48px + env(safe-area-inset-bottom,0px))}
.view.open{display:block}
.view header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.view h1{margin:0;font-size:34px;line-height:1;font-weight:780;font-stretch:118%;letter-spacing:-.02em}
.view .meta{color:var(--muted);font-size:14px;margin:0 0 8px}
.hbtns{display:flex;gap:8px}
.hbtns .btn{background:var(--card)}
#ov .wrap{max-width:1080px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px 13px;box-shadow:var(--shadow)}
.kpi::before{content:"";display:block;width:22px;height:3px;background:var(--firuzeh);margin-bottom:10px}
.kpi b{display:block;font-size:30px;line-height:1.05;font-weight:700;font-stretch:110%;letter-spacing:-.01em}
.kpi span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.3}

function BX(x, y, w, h, title, sub, cls){
  var cx = x + w/2, r = '<rect class="bx'+(cls?' '+cls:'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4"/>';
  if(sub){

/* camera */
var vp=document.getElementById("viewport");
var cam={x:0,y:0,s:1};
var MIN=.15, MAX=2.2;
function apply(){
  world.style.transform="translate("+cam.x+"px,"+cam.y+"px) scale("+cam.s+")";
  vp.style.backgroundPosition=cam.x+"px "+cam.y+"px";
  vp.style.backgroundSize=(24*cam.s)+"px "+(24*cam.s)+"px";
  document.getElementById("zoomval").textContent=Math.round(cam.s*100)+"%";
}
function zoomAt(f, px, py){
  var ns=Math.min(MAX,Math.max(MIN,cam.s*f)); f=ns/cam.s;
  cam.x=px-(px-cam.x)*f; cam.y=py-(py-cam.y)*f; cam.s=ns; apply();
}
function bounds(){
  var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  CARDS.forEach(function(c){ x0=Math.min(x0,c.x); y0=Math.min(y0,c.y); x1=Math.max(x1,c.x+c.wd); y1=Math.max(y1,c.y+c.h+40); });
  CLUSTERS.forEach(function(c){ y0=Math.min(y0,c.y); });
  return {x0:x0,y0:y0,x1:x1,y1:y1};
}
var animId=null;
function flyTo(tx,ty,ts){
  if(animId) cancelAnimationFrame(animId);
  if(reduced()){ cam.x=tx; cam.y=ty; cam.s=ts; apply(); return; }
  var sx=cam.x, sy=cam.y, ss=cam.s, t0=performance.now(), D=520;
  (function step(now){
    var k=Math.min(1,(now-t0)/D); k=1-Math.pow(1-k,3);
    cam.x=sx+(tx-sx)*k; cam.y=sy+(ty-sy)*k; cam.s=ss+(ts-ss)*k; apply();
    if(k<1) animId=requestAnimationFrame(step);
  })(t0);
}
function fit(animate){
  var b=bounds(), W=vp.clientWidth, H=vp.clientHeight;
  var pad = W<640 ? 24 : 80;
  var s=Math.min((W-pad*2)/(b.x1-b.x0),(H-pad*2-150)/(b.y1-b.y0));
  s=Math.min(1,Math.max(MIN,s));
  var tx=W/2-((b.x0+b.x1)/2)*s, ty=(H+80)/2-((b.y0+b.y1)/2)*s;
  if(animate) flyTo(tx,ty,s); else { cam.x=tx; cam.y=ty; cam.s=s; apply(); }
}
function home(){
  // on narrow screens the whole board is too small to read, so start on the title block
  var W=vp.clientWidth, H=vp.clientHeight;
  var b=bounds();
  var s=Math.min((W-160)/(b.x1-b.x0),(H-260)/(b.y1-b.y0));
  if(s>=.42) return fit(false);
  var s2=Math.min(.82,(W-32)/TB.w);
  cam.s=s2; cam.x=W/2-(TB.x+TB.w/2)*s2; cam.y=H/2-(TB.y+tb.offsetHeight/2)*s2+30; apply();
}
function revealCard(c){
  var W=vp.clientWidth, H=vp.clientHeight;
  // while the detail panel is open on a wide screen, only the area to its left is free
  var p=document.getElementById("panel");
  var right=(p.classList.contains("open") && W>640) ? W-p.offsetWidth-32 : W;
  var l=cam.x+c.x*cam.s, t=cam.y+c.y*cam.s, r=l+c.wd*cam.s, btm=t+c.h*cam.s;
  if(l<20||t<110||r>right-20||btm>H-90){
    var s=Math.max(cam.s,.6);
    if(c.wd*s>right-40) s=Math.max(MIN,(right-40)/c.wd);
    flyTo(right/2-(c.x+c.wd/2)*s, (H+40)/2-(c.y+c.h/2)*s, s);
  }
}

/* pointer pan and pinch */
var pts=new Map(), last=null, moved=false, downAt=null, pinch=null;
vp.addEventListener("pointerdown",function(e){
  if(e.button!==0 && e.pointerType==="mouse") return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ last={x:e.clientX,y:e.clientY}; downAt={x:e.clientX,y:e.clientY}; moved=false; }
  if(pts.size===2){ var a=Array.from(pts.values()); pinch={d:dist(a[0],a[1]),s:cam.s}; moved=true;
    pts.forEach(function(_,id){ try{ vp.setPointerCapture(id); }catch(err){} }); }
});
vp.addEventListener("pointermove",function(e){
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2 && pinch){
    var a=Array.from(pts.values()), d=dist(a[0],a[1]), mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    zoomAt((pinch.s*d/pinch.d)/cam.s, mid.x, mid.y); moved=true; hideHint(); return;
  }
  if(pts.size===1 && last){
    if(!moved && Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>5){ moved=true; vp.classList.add("dragging"); hideHint(); try{ vp.setPointerCapture(e.pointerId); }catch(err){} }
    if(moved){ cam.x+=e.clientX-last.x; cam.y+=e.clientY-last.y; apply(); }
    last={x:e.clientX,y:e.clientY};
  }
});
function endPtr(e){
  pts.delete(e.pointerId);
  if(pts.size<2) pinch=null;
  if(pts.size===1){ var a=Array.from(pts.values())[0]; last={x:a.x,y:a.y}; }
  if(pts.size===0){ last=null; vp.classList.remove("dragging");
    if(!moved && panelOpen() && !(e.target.closest && e.target.closest(".card"))) closePanel();
    setTimeout(function(){ moved=false; },0);
  }
}
vp.addEventListener("pointerup",endPtr);
vp.addEventListener("pointercancel",endPtr);
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
vp.addEventListener("wheel",function(e){
  e.preventDefault(); hideHint();
  if(e.ctrlKey||e.metaKey){ zoomAt(Math.exp(-e.deltaY*0.01), e.clientX, e.clientY); }
  else { cam.x-=e.deltaX; cam.y-=e.deltaY; apply(); }
},{passive:false});

function fitCards(list){

  list.forEach(function(c){ x0=Math.min(x0,c.x); y0=Math.min(y0,c.y-60); x1=Math.max(x1,c.x+c.wd); y1=Math.max(y1,c.y+c.h+40); });

/* tooltip, shared by every chart, bar and cell */
var tip=document.getElementById("tip"), tipFor=null;
function showTip(t, x, y){
  var parts=String(t).split("|");
  tip.innerHTML=""; var b=document.createElement("b"); b.textContent=parts[0]; tip.appendChild(b);
  if(parts[1]){ var s=document.createElement("span"); s.textContent=parts[1]; tip.appendChild(s); }
  tip.classList.add("on");
  var w=tip.offsetWidth, h=tip.offsetHeight, X=x+14, Y=y+16;
  if(X+w>innerWidth-8) X=x-w-14;
  if(Y+h>innerHeight-8) Y=y-h-12;
  tip.style.left=Math.max(8,X)+"px"; tip.style.top=Math.max(8,Y)+"px";
}
function hideTip(){ tip.classList.remove("on"); tipFor=null; }
document.addEventListener("pointermove",function(e){
  var c=e.target.closest && e.target.closest("[data-cross]");
  if(c){ crossMove(c,e); return; }
  var t=e.target.closest && e.target.closest("[data-tip]");
  if(t && e.pointerType!=="touch"){ tipFor=t; showTip(t.getAttribute("data-tip"), e.clientX, e.clientY); }
  else if(tipFor){ hideTip(); }
  var col=e.target.closest && e.target.closest(".mx [data-col]");
  document.querySelectorAll(".mx .colhl").forEach(function(x){ if(!col || x.dataset.col!==col.dataset.col || x.closest("table")!==col.closest("table")) x.classList.remove("colhl"); });
  if(col) col.closest("table").querySelectorAll('[data-col="'+col.dataset.col+'"]').forEach(function(x){ x.classList.add("colhl"); });
});
document.addEventListener("pointerleave",hideTip);
document.addEventListener("focusin",function(e){
  var t=e.target.closest && e.target.closest("[data-tip]");
  if(t){ var r=t.getBoundingClientRect(); showTip(t.getAttribute("data-tip"), r.left, r.bottom); } else hideTip();
});
document.addEventListener("focusout",hideTip);
function crossMove(rect, e){
  var svg=rect.ownerSVGElement, r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
  var x=(e.clientX-r.left)/r.width*vb.width;
  x=Math.max(70,Math.min(430,x));
  var n=Math.pow(10,1+(x-70)/45), er=1/Math.sqrt(n), y=24+(-Math.log10(er))*30;
  var ln=svg.querySelector(".cross"), dt=svg.querySelector(".crossdot");
  ln.setAttribute("x1",x); ln.setAttribute("x2",x); ln.classList.add("on");
  dt.setAttribute("cx",x); dt.setAttribute("cy",y); dt.classList.add("on");
  var shots = n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+" million" : Math.round(n).toLocaleString("en-US");
  showTip("±"+String(Number(er.toPrecision(2)))+"|"+shots+" shots per feature", e.clientX, e.clientY);
  tipFor=rect;
  rect.onpointerleave=function(){ ln.classList.remove("on"); dt.classList.remove("on"); hideTip(); };
}

/* delegated actions: open a card, focus a skill or group, clear */
document.addEventListener("click",function(e){
  var o=e.target.closest && e.target.closest("[data-open]");
  if(o){ var c=byId[o.dataset.open]; if(c){ openPanel(c, c.el, false, o); if(!anyView()) revealCard(c); } return; }
  var s=e.target.closest && e.target.closest("[data-skill]");
  if(s){
    var name=s.dataset.skill;
    setFocus(FOCUS.skill===name ? {} : {skill:name});
    if(panelOpen() && openCard && openCard.id==="kit" && FOCUS.skill){ closePanel(); }
    return;
  }
  var g=e.target.closest && e.target.closest("[data-group]");
  if(g){ setFocus({group:g.dataset.group}); return; }
  var x=e.target.closest && e.target.closest("[data-clear]");
  if(x){ setFocus({}); return; }
});

/* detail panel */
var panel=document.getElementById("panel"), openEl=null, openCard=null, returnEl=null;
function panelOpen(){ return panel.classList.contains("open"); }
function listHTML(items){ return "<ul>"+items.map(function(p){return "<li>"+p+"</li>";}).join("")+"</ul>"; }
function factsHTML(c){
  if(!c.facts) return "";
  return "<dl class='facts'>"+c.facts.map(function(f){return "<dt>"+esc(f[0])+"</dt><dd>"+f[1]+"</dd>";}).join("")+"</dl>";
}
function findsHTML(){
  return "<div class='finds'>"+FINDS.map(function(f){ return "<div class='find'><b>"+esc(f[0])+"</b><div><p class='ft'>"+esc(f[1])+"</p><p class='fd'>"+esc(f[2])+"</p></div></div>"; }).join("")+"</div>";
}
function failsHTML(){
  return "<p class='fintro'>Each hypothesis had a numeric pass bar fixed before any data was collected. Here is what was predicted, what actually happened, and what changed because of it.</p><div class='fails'>"+
    FAILS.map(function(f){ return "<div class='fail'><div class='fhead'><span class='tag'>"+esc(f.tag)+"</span><span class='x'>\u2717 Falsified</span><span class='got'>"+esc(f.got)+"</span></div>"+
      "<p class='hyp'>"+esc(f.hyp)+"</p><dl><dt>What happened</dt><dd>"+esc(f.what)+"</dd><dt>What it changed</dt><dd>"+esc(f.led)+"</dd></dl></div>"; }).join("")+"</div>";
}
function sectionsHTML(c, tag){
  if(!c.sections) return (c.summary || !c.points) ? "" : listHTML(c.points);
  return c.sections.map(function(s){
    return "<div class='sec'><"+tag+">"+esc(s.h)+"</"+tag+">"+(s.finds?findsHTML():"")+(s.fails?failsHTML():"")+(s.fig?figHTML(s.fig, s.cap):"")+(s.p?"<p>"+s.p+"</p>":"")+(s.list?listHTML(s.list):"")+"</div>";
  }).join("");
}
function statsHTML(c){
  if(!c.stats) return "";
  return "<div class='stats'>"+c.stats.map(function(s){return "<div><b>"+s[0]+"</b><span>"+esc(s[1])+"</span></div>";}).join("")+"</div>";
}
// card content is authored in this file, so it is inserted as HTML on purpose (for code, sup, b)
function detailHTML(c){
  var h="";
  if(c.summary) h+="<p class='lede'>"+c.summary+"</p>";
  if(c.leadFinds) h+=findsHTML();
  h+=statsHTML(c)+factsHTML(c)+sectionsHTML(c,"h3");
  return h;
}
function openPanel(c, b, keepFocus, from){
  if(openEl) openEl.setAttribute("aria-expanded","false");
  openEl=b; b.setAttribute("aria-expanded","true");
  openCard=c; returnEl=from||b;
  document.getElementById("p-title").textContent=c.title;
  document.getElementById("p-stack").textContent=c.stack||"";
  document.getElementById("p-when").textContent=c.when||"";
  document.getElementById("p-body").innerHTML=detailHTML(c);
  document.getElementById("p-aside").textContent=c.aside||"";
  var i=CARDS.indexOf(c);
  document.getElementById("p-count").textContent=(i+1)+" of "+CARDS.length;
  document.getElementById("p-ask").href="mailto:hamideinamirshayan@gmail.com?subject="+encodeURIComponent("Question about "+c.title);
  panel.scrollTop=0;
  panel.classList.add("open"); panel.setAttribute("aria-hidden","false"); document.body.classList.add("panel-open");
  applyFocus();
  if(!keepFocus) document.getElementById("close").focus({preventScroll:true});
  hideHint();
}
function step(d){
  if(!openCard) return;
  var i=(CARDS.indexOf(openCard)+d+CARDS.length)%CARDS.length, c=CARDS[i];
  openPanel(c, c.el, true, returnEl);
  if(!anyView()) revealCard(c);
}
document.getElementById("p-prev").onclick=function(){ step(-1); };
document.getElementById("p-next").onclick=function(){ step(1); };
function closePanel(){
  panel.classList.remove("open"); panel.setAttribute("aria-hidden","true"); document.body.classList.remove("panel-open");
  if(openEl){ openEl.setAttribute("aria-expanded","false"); openEl=null; }
  if(returnEl && returnEl.focus) returnEl.focus({preventScroll:true});
  openCard=null; returnEl=null; hideTip();
}
document.getElementById("close").onclick=closePanel;

/* overview: the whole portfolio as one organized dashboard */
var ov=document.getElementById("ov"), doc=document.getElementById("doc");
function anyView(){ return ov.classList.contains("open") || doc.classList.contains("open"); }
function D(s){ return new Date(s+"T00:00:00"); }
function pct(s){ var a=D(TL_START), b=D(TL_END), t=(typeof s==="string")?D(s):s; return Math.max(0,Math.min(100,(t-a)/(b-a)*100)); }
function timelineHTML(){
  var now=new Date(), nowP=pct(now);
  var h='<div class="tl"><div class="tl-bg">';
  SEMS.forEach(function(s,i){ h+='<div class="tl-band'+(i%2?' alt':'')+'" style="left:'+pct(s[1])+'%;width:'+(pct(s[2])-pct(s[1]))+'%"><b><span class="lf">'+esc(s[0])+'</span><span class="ls">'+esc(s[3])+'</span></b></div>'; });
  var m=D(TL_START), names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  while(m<D(TL_END)){
    var mid=new Date(m.getFullYear(), m.getMonth(), 15);
    h+='<span class="tl-tick" style="left:'+pct(mid)+'%">'+names[m.getMonth()]+'</span>';
    m=new Date(m.getFullYear(), m.getMonth()+1, 1);
  }
  if(nowP>0 && nowP<100) h+='<div class="tl-now" style="left:'+nowP+'%"><span>today</span></div>';
  h+='</div><div class="tl-head"></div>';
  var lastLane=null;
  TIMELINE.forEach(function(it){
    var first=it.lane!==lastLane; lastLane=it.lane;
    var a=pct(it.start), endP=it.open ? nowP : pct(it.end||it.start);
    var attrs=(it.card?' data-open="'+it.card+'"':'')+' data-tip="'+esc(it.tip)+'"'+' aria-label="'+esc(it.tip.replace("|",", "))+'"';
    var cls=it.card?"":" static";
    h+='<div class="tl-row'+(first?' first':'')+'"'+(it.card?' data-row-card="'+it.card+'"':'')+'><div class="tl-lane">'+(first?esc(it.lane):'')+'</div><div class="tl-plot">';
    var labEnd = a>58;
    if(it.point){
      h+='<button type="button" class="tl-pt'+cls+'" style="left:'+a+'%"'+attrs+'></button>';
      h+='<span class="tl-lab'+(labEnd?' end':'')+'" style="left:calc('+a+'% '+(labEnd?'+ 8px':'- 6px')+')">'+esc(it.label)+'</span>';
    } else {
      var w=Math.max(0.6,endP-a);
      var bg;
      var donePart = it.open ? 100 : Math.max(0,Math.min(100,(nowP-a)/(endP-a)*100));
      if(it.fuzzy) bg='linear-gradient(90deg,color-mix(in srgb,var(--firuzeh) 12%,var(--card)) 0%,var(--firuzeh) 34%,var(--firuzeh) 100%)';
      else if(donePart<100) bg='linear-gradient(90deg,var(--firuzeh) 0 '+donePart+'%,color-mix(in srgb,var(--firuzeh) 32%,var(--card)) '+donePart+'% 100%)';
      else bg='var(--firuzeh)';
      h+='<button type="button" class="tl-bar'+cls+'" style="left:'+a+'%;width:'+w+'%;background:'+bg+'"'+attrs+'></button>';
      if(it.flag) h+='<button type="button" class="tl-pt static" style="left:'+endP+'%" data-tip="Graduation|December 2026" aria-label="Graduation, December 2026"></button>';
      var lx = labEnd ? 'left:'+(a+w)+'%' : 'left:'+a+'%';
      h+='<span class="tl-lab'+(labEnd?' end':'')+'" style="'+lx+'">'+esc(it.label)+(it.flag?'<span class="grad">  ·  graduation Dec 2026</span>':'')+'</span>';
    }
    h+='</div></div>';
  });
  h+='</div>';
  h+='<div class="legend"><span><i class="lg-bar"></i>done, or to date</span><span><i class="lg-rest"></i>rest of the current term</span><span><i class="lg-fade"></i>start known only to the year</span><span><i class="lg-pt"></i>milestone</span><span><i class="lg-now"></i>today</span></div>';
  return h;
}
function indexHTML(){
  var order=["research","build","teach"], names={research:"Research",build:"Built",teach:"Teaching"};
  var h='<div class="ix">';
  order.forEach(function(g){
    CARDS.filter(function(c){ return c.group===g; }).forEach(function(c){
      h+='<div class="ix-row" data-row-card="'+c.id+'"><div><b>'+esc(c.title)+'</b><span class="g">'+esc(c.gist)+'</span><span class="st">'+esc(c.stack||"")+'</span></div>'+
        '<span class="ar">'+names[g]+'</span><span class="wh">'+esc(c.when||"")+'</span><button type="button" class="btn" data-open="'+c.id+'">Details</button></div>';
    });
  });
  return h+'</div>';
}
function buildOverview(){
  var k=KPIS.map(function(x){ return '<div class="kpi"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'; }).join("");
  document.getElementById("ov-body").innerHTML=
    "<header><div><h1>"+esc(ME.name)+"</h1><p class='meta' style='margin-top:8px'>"+esc(ME.role)+". "+esc(ME.auth)+".</p></div>"+
    "<div class='hbtns'><button class='btn' data-view='doc'>Read as page</button><button class='btn' data-view='canvas'>Back to canvas</button></div></header>"+
    "<div class='kpis'>"+k+"</div>"+
    "<div class='ovbar'><span class='lab'>Filter</span><div class='chips'>"+chipsHTML()+"</div><span class='lab' id='ov-status' aria-live='polite'></span></div>"+
    "<section class='osec'><h2>Timeline</h2><p class='sub'>Every dated item from Fall 2025 to graduation. Select a bar to open its details.</p>"+timelineHTML()+"</section>"+
    "<div class='ogrid'>"+
      "<section class='osec'><h2>Everything on the board</h2><p class='sub'>Grouped by area, with the stack for each.</p>"+indexHTML()+"</section>"+
      "<section class='osec'><h2>Skills by project</h2><p class='sub'>Each dot is a technology in that project's stack. Select a skill to filter, or a project name to open it.</p>"+matrixHTML()+"</section>"+
    "</div>";
}
function openOverview(){
  buildOverview(); doc.classList.remove("open"); ov.classList.add("open"); ov.scrollTop=0; applyFocus();
  var b=ov.querySelector("[data-view='canvas']"); if(b) b.focus({preventScroll:true});
}
function closeViews(){ ov.classList.remove("open"); doc.classList.remove("open"); document.getElementById("ovbtn").focus(); applyFocus(); }

/* read as page */
function buildDoc(){
  var g=function(k){ return CARDS.filter(function(c){return c.group===k;}); };
  var sec=function(t, list){
    return "<h2>"+t+"</h2>"+list.map(function(c){
      return "<h3>"+esc(c.title)+"</h3><p class='meta'>"+esc([c.stack,c.when].filter(Boolean).join(", "))+"</p>"+
        (c.summary?"<p>"+c.summary+"</p>":"")+factsHTML(c)+sectionsHTML(c,"h4");
    }).join("");
  };
  var kit=byId.kit;
  document.getElementById("doc-body").innerHTML=
    "<header><div><h1>"+esc(ME.name)+"</h1><p class='meta' style='margin-top:8px'>"+esc(ME.role)+"</p></div><div class='hbtns'><button class='btn' data-view='ov'>Overview</button><button class='btn' data-view='canvas'>Back to canvas</button></div></header>"+
    "<p class='meta'><a href='mailto:hamideinamirshayan@gmail.com'>hamideinamirshayan@gmail.com</a>, <a href='https://www.linkedin.com/in/amirshayan-hamidin'>LinkedIn</a>, <a href='https://github.com/AmirshayanHamidin'>GitHub</a></p>"+
    "<h2>Education</h2><p>"+esc(ME.school)+", "+esc(ME.degree)+", expected December 2026. GPA "+esc(ME.gpa)+". "+esc(ME.auth)+".</p>"+
    sec("Research", g("research"))+sec("Things I built", g("build"))+sec("Teaching", g("teach"))+
    "<h2>Toolkit</h2><ul>"+kit.points.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+"</ul>"+
    "<h4>Skills by project</h4>"+matrixHTML();
}
function openDoc(){ buildDoc(); ov.classList.remove("open"); doc.classList.add("open"); doc.scrollTop=0; applyFocus(); var b=doc.querySelector("[data-view='canvas']"); if(b) b.focus({preventScroll:true}); }
document.getElementById("read").onclick=openDoc;
document.getElementById("ovbtn").onclick=openOverview;
document.addEventListener("click",function(e){
  var v=e.target.closest && e.target.closest("[data-view]");
  if(!v) return;
  if(v.dataset.view==="doc") openDoc(); else if(v.dataset.view==="ov") openOverview(); else closeViews();
});

/* keyboard */
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ if(panelOpen()) closePanel(); else if(anyView()) closeViews(); else if(FOCUS.skill||FOCUS.group!=="all") setFocus({}); return; }
  if(anyView()) return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var stepPx=60;
  if(e.key==="ArrowLeft"){ cam.x+=stepPx; apply(); }
  else if(e.key==="ArrowRight"){ cam.x-=stepPx; apply(); }
  else if(e.key==="ArrowUp"){ cam.y+=stepPx; apply(); }
  else if(e.key==="ArrowDown"){ cam.y-=stepPx; apply(); }
  else if(e.key==="+"||e.key==="="){ var c=center(); zoomAt(1.2,c.x,c.y); }
  else if(e.key==="-"){ var c2=center(); zoomAt(1/1.2,c2.x,c2.y); }
});

var hint=document.getElementById("hint"), hinted=false;
function hideHint(){ if(hinted) return; hinted=true; hint.style.opacity="0"; }

/* first paint: everything starts as a sketch, then renders in once */
function start(){
  layoutExtras();
  home();
  applyFocus();
  if(reduced()){ cardEls.forEach(function(b){ b.classList.add("rendered"); }); return; }
  setTimeout(function(){
    cardEls.forEach(function(b,i){ setTimeout(function(){ b.classList.add("rendered"); }, i*110); });
  }, 650);
}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(start, start); } else { window.addEventListener("load", start); }
window.addEventListener("resize", function(){ apply(); });

})();
</script>
